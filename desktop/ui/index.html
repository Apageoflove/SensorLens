<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SensorLens</title>
<style>
  html, body { margin: 0; height: 100%; background: #161616; color: #d8d8d8;
    font: 13px/1.6 "Segoe UI", system-ui, "Microsoft YaHei", "PingFang SC", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  main { width: 460px; }
  .mark { font: 600 15px "Cascadia Mono", Consolas, monospace; margin-bottom: 18px; }
  .mark img { width: 28px; height: 28px; vertical-align: -8px; margin-right: 10px; }
  .mark span { color: #6e6e6e; font: 12px "Segoe UI", "Microsoft YaHei", sans-serif; margin-left: 10px; }
  p { margin: 0 0 12px; color: #9a9a9a; }
  code { font: 12px "Cascadia Mono", Consolas, monospace; color: #d8d8d8; word-break: break-all; }
  .btns { display: flex; gap: 8px; margin-top: 16px; }
  button { font: inherit; height: 28px; padding: 0 14px; border-radius: 2px; cursor: pointer;
    color: #d8d8d8; background: #242424; border: 1px solid #3a3a3a; }
  button:hover { background: #2c2c2c; }
  button.primary { background: #d9a441; border-color: #d9a441; color: #1a1a1a; font-weight: 600; }
  pre { white-space: pre-wrap; font: 11.5px/1.5 "Cascadia Mono", Consolas, monospace; color: #e0675c;
    background: #1c1c1c; border: 1px solid #2c2c2c; padding: 8px 10px; max-height: 240px; overflow: auto; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="mark"><img src="icon.png" alt="">SensorLens<span id="ver"></span></div>
  <section id="setup" hidden>
    <p>第一次使用，请选择数据目录。上传的数据、索引缓存和日志都会放在这里；升级或重装软件不会动它，之后可以在右下角“数据目录”切换。</p>
    <p>默认位置：<code id="def"></code></p>
    <div class="btns">
      <button id="useDefault" class="primary">使用默认位置</button>
      <button id="pick">选择其他文件夹…</button>
    </div>
  </section>
  <section id="loading" hidden><p id="msg">正在启动…</p></section>
  <section id="error" hidden>
    <p>后端启动失败。</p>
    <pre id="err"></pre>
    <div class="btns"><button id="retry" class="primary">重试</button><button id="repick">更换数据目录…</button></div>
  </section>
</main>
<script>
const { invoke } = window.__TAURI__.core;
const $ = (s) => document.querySelector(s);
function show(id) { for (const s of ["setup", "loading", "error"]) $("#" + s).hidden = s !== id; }
async function start(dir) {
  show("loading");
  $("#msg").textContent = "正在启动后端… " + (dir || "");
  try { await invoke("start"); } catch (e) { $("#err").textContent = String(e); show("error"); }
}
async function choose(useDefault) {
  try {
    const dir = await invoke("choose_data_dir", { useDefault });
    if (dir) start(dir);
  } catch (e) { $("#err").textContent = String(e); show("error"); }
}
$("#useDefault").onclick = () => choose(true);
$("#pick").onclick = () => choose(false);
$("#repick").onclick = () => choose(false);
$("#retry").onclick = () => start();
invoke("app_info").then((info) => {
  $("#ver").textContent = "v" + info.version;
  $("#def").textContent = info.default_data_dir || "";
  if (info.data_dir) start(info.data_dir); else show("setup");
});
</script>
</body>
</html>

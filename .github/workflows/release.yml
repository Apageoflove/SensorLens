name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: pip install -r requirements-build.txt
      - run: python -m pytest -q -p no:cacheprovider

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4

      - name: 版本号与标签一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(python3 -c "import json;print(json.load(open('desktop/src-tauri/tauri.conf.json',encoding='utf-8'))['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tauri.conf.json 版本 $v 与标签 ${GITHUB_REF_NAME} 不一致"; exit 1; }

      - name: Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev rpm file

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: 构建 Python 后端
        run: |
          pip install -r requirements-build.txt
          python packaging/build_backend.py

      - name: 构建桌面安装包
        working-directory: desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}

      - name: 收集安装包和便携版
        shell: bash
        run: |
          set -euo pipefail
          v=$(python3 -c "import json;print(json.load(open('desktop/src-tauri/tauri.conf.json',encoding='utf-8'))['version'])")
          mkdir -p out
          b=desktop/src-tauri/target/release/bundle
          find "$b" -maxdepth 2 -type f \( -name '*-setup.exe' -o -name '*-setup.exe.sig' -o -name '*.deb' -o -name '*.deb.sig' \
            -o -name '*.rpm' -o -name '*.rpm.sig' -o -name '*.AppImage' -o -name '*.AppImage.sig' \) -exec cp {} out/ \;
          p=ad-viz-portable
          rm -rf "$p"; mkdir "$p"
          cp -r build/backend "$p/backend"
          : > "$p/.portable"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp desktop/src-tauri/target/release/ad-viz.exe "$p/"
            7z a -tzip "out/ad-viz_${v}_windows_x64_portable.zip" "$p" > /dev/null
          else
            cp desktop/src-tauri/target/release/ad-viz "$p/"
            chmod +x "$p/ad-viz" "$p/backend/adviz-backend"
            tar czf "out/ad-viz_${v}_linux_x64_portable.tar.gz" "$p"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - name: 生成 latest.json
        run: |
          v="${GITHUB_REF_NAME#v}"
          python3 packaging/make_latest_json.py art "$v" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" "ad-viz ${GITHUB_REF_NAME}"
          ls -la art
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd art
          files=$(ls | grep -v '\.sig$')
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "ad-viz $GITHUB_REF_NAME" \
            --notes-file <(printf '安装版：Windows 用 *-setup.exe，Linux 用 .deb / .rpm / .AppImage。\n便携版：*_portable.zip / *_portable.tar.gz，解压即用，数据默认放在解压目录里的 ad-viz-data。\n已安装的版本可以在程序右下角“检查更新”直接升级。\n') \
            $files *.sig
